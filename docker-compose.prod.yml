# Vexlyx — Production Overlay (F5.1)
#
# Applied on top of docker-compose.yml (the dev environment, left
# unmodified) via:
#   docker compose --env-file /etc/vexlyx/vexlyx.env \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Only carries the prod-specific diffs: locking down ports that dev exposes
# to 0.0.0.0, wiring in generated secrets and the real panel domain/ACME
# email, disabling dev-only fixtures, and adding the panel itself (dashboard
# + api) as containers. `!reset` clears a base list (ports/volumes) instead
# of appending to it — see https://github.com/compose-spec/compose-spec/blob/master/13-merge.md
# — so overriding those keys here fully replaces the dev bindings rather
# than exposing both.
#
# Rendered by system/scripts/install/steps/*.sh; all ${VARS} below come from
# /etc/vexlyx/vexlyx.env (generated once, never rotated by re-running the
# installer — see docs/dev/installer.md).

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  mysql:
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  redis:
    ports: !reset []

  adminer:
    # Raw DB browser — never started by a plain `docker compose up -d` in
    # production. Opt in with system/scripts/enable-adminer.sh, which sets
    # ADMINER_BASIC_AUTH + ADMINER_URL in the secrets file and starts it with
    # `--profile adminer`. It is served only through Traefik over HTTPS behind
    # basic auth (never on a published host port), so it is not reachable
    # unauthenticated. An empty ADMINER_BASIC_AUTH leaves the middleware with
    # no valid users, so requests are rejected rather than let through.
    profiles: ["adminer"]
    ports: !reset []
    labels: !override
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.adminer.rule=Host(`adminer.${VEXLYX_DOMAIN}`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.adminer.middlewares=adminer-auth"
      - "traefik.http.middlewares.adminer-auth.basicauth.users=${ADMINER_BASIC_AUTH:-}"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  traefik:
    ports: !override
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes: !override
      - ./docker/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
      - ./docker/traefik/acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro

  coredns:
    # Loopback-only with the forwarding Corefile by default: that Corefile
    # forwards unmatched queries to public resolvers, so publishing it on a
    # public address would stand up an open recursive resolver.
    # To make this server a public authoritative nameserver (F5.27), set in
    # /etc/vexlyx/vexlyx.env:
    #   VEXLYX_DNS_BIND=<this host's private IP>   (not 0.0.0.0 — systemd-resolved holds 127.0.0.53:53)
    #   VEXLYX_COREFILE=./docker/coredns/Corefile.public   (no forwarding)
    ports: !override
      - "${VEXLYX_DNS_BIND:-127.0.0.1}:${DNS_PORT:-53}:53/udp"
      - "${VEXLYX_DNS_BIND:-127.0.0.1}:${DNS_PORT:-53}:53/tcp"
    volumes: !override
      - ${VEXLYX_COREFILE:-./docker/coredns/Corefile}:/etc/coredns/Corefile:ro
      - ./docker/coredns/zones:/etc/coredns/zones:ro

  postfix:
    environment:
      MYHOSTNAME: ${VEXLYX_MAIL_HOSTNAME}
      MYDOMAIN: ${VEXLYX_MAIL_DOMAIN}
      # Never seed the known-password dev test mailboxes in production.
      VEXLYX_SEED_DEV_FIXTURES: "false"
    volumes:
      - ./docker/mail-data/certs:/etc/postfix/certs:ro

  dovecot:
    environment:
      VEXLYX_SEED_DEV_FIXTURES: "false"
    volumes:
      - ./docker/mail-data/certs:/etc/dovecot/certs:ro

  # The base file routes Roundcube on the dev hostname over plain HTTP, which
  # 404s in production — serve it at webmail.${VEXLYX_DOMAIN} over HTTPS
  # (the same host the API advertises as WEBMAIL_URL).
  roundcube:
    environment:
      # Strict TLS to Dovecot/Postfix: verify the trusted mail certificate
      # (synced from Traefik) against the public mail hostname, since Roundcube
      # connects via the internal service names. Set explicitly so the prod
      # overlay can never inherit the relaxed development setting.
      ROUNDCUBE_MAIL_TLS_VERIFY: "true"
      ROUNDCUBE_MAIL_TLS_PEER_NAME: ${VEXLYX_MAIL_HOSTNAME}
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`webmail.${VEXLYX_DOMAIN}`)"
      - "traefik.http.routers.webmail.entrypoints=websecure"
      - "traefik.http.routers.webmail.tls.certresolver=letsencrypt"
      - "traefik.http.services.webmail.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # The panel itself
  # ---------------------------------------------------------------------------

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${VEXLYX_DOMAIN}
        NEXT_PUBLIC_MAIL_HOSTNAME: ${VEXLYX_MAIL_HOSTNAME}
    image: vexlyx-dashboard:latest
    container_name: vexlyx-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Next.js standalone's server.js binds to `process.env.HOSTNAME` if
      # set, and Docker always auto-sets HOSTNAME to the container ID. On a
      # container attached to two networks (default + traefik-net), that
      # self-hostname can resolve to either IP depending on attach order —
      # if it resolves to the non-traefik-net IP, Traefik gets a connection
      # refused (502) even though the container is healthy. Pinning HOSTNAME
      # to 0.0.0.0 makes it listen on every interface, not just one.
      HOSTNAME: "0.0.0.0"
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.vexlyx-dashboard.rule=Host(`${VEXLYX_DOMAIN}`)"
      - "traefik.http.routers.vexlyx-dashboard.entrypoints=websecure"
      - "traefik.http.routers.vexlyx-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.vexlyx-dashboard.loadbalancer.server.port=3000"
      # This router exists so Traefik obtains and renews the certificate used
      # by SMTP/IMAP. Mail protocols themselves still connect directly.
      - "traefik.http.routers.vexlyx-mail-cert.rule=Host(`${VEXLYX_MAIL_HOSTNAME}`)"
      - "traefik.http.routers.vexlyx-mail-cert.entrypoints=websecure"
      - "traefik.http.routers.vexlyx-mail-cert.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vexlyx-mail-cert.service=vexlyx-dashboard"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: vexlyx-api:latest
    container_name: vexlyx-api
    restart: unless-stopped
    # See apps/api/Dockerfile — this image ships only the runtime toolchain.
    # The actual app (already `pnpm install`'d / `pnpm build`'d / `prisma
    # generate`'d on the host by the installer) is bind-mounted in below at
    # the same absolute path the host uses, so the Python subprocesses this
    # process spawns — and the `docker compose` commands THEY spawn against
    # the host daemon via the mounted socket — resolve identical paths on
    # both sides.
    volumes:
      - ${VEXLYX_HOME:-/opt/vexlyx}:${VEXLYX_HOME:-/opt/vexlyx}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOST: 0.0.0.0
      CORS_ORIGIN: https://${VEXLYX_DOMAIN}
      # Shares the session cookie between the dashboard (${VEXLYX_DOMAIN})
      # and the API (api.${VEXLYX_DOMAIN}) — without this, apps/dashboard's
      # server-side auth guards ((panel)/layout.tsx, (standalone)/layout.tsx)
      # never see the cookie and always redirect to /login even when logged in.
      COOKIE_DOMAIN: ${VEXLYX_DOMAIN}
      DATABASE_URL: postgresql://vexlyx:${POSTGRES_PASSWORD}@postgres:5432/vexlyx_dev
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_KEY_LEGACY_FALLBACK: ${ENCRYPTION_KEY_LEGACY_FALLBACK:-false}
      ALLOW_REGISTRATION: "false"
      API_BASE_URL: https://api.${VEXLYX_DOMAIN}
      BASE_DOMAIN: ${VEXLYX_BASE_DOMAIN}
      # DNS Records & Public IP Onboarding (F5.9)
      PANEL_DOMAIN: ${VEXLYX_DOMAIN}
      PUBLIC_IP: ${VEXLYX_PUBLIC_IP:-}
      HOSTED_MAIL_HOSTNAME: ${VEXLYX_MAIL_HOSTNAME}
      HOSTED_MAIL_DOMAIN: ${VEXLYX_MAIL_DOMAIN}
      # Nameservers users delegate to for hosted DNS (F5.25/F5.27)
      DNS_NAMESERVERS: ${DNS_NAMESERVERS:-ns1.vexlyx.com,ns2.vexlyx.com}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      IMAP_HOST: dovecot
      # System email (F5.23): panel mail is relayed through the bundled Postfix
      # over the internal network, sent as notifications@${VEXLYX_DOMAIN}. The
      # panel (sub)domain keeps this mail's reputation separate from the apex
      # domain, and replies go to the admin.
      BUNDLED_SMTP_HOST: postfix
      MAIL_DOMAIN: ${VEXLYX_DOMAIN}
      MAIL_REPLY_TO: ${VEXLYX_ADMIN_EMAIL:-}
      WEBMAIL_URL: https://webmail.${VEXLYX_DOMAIN}
      # Adminer stays disabled in production unless this is set to a protected
      # HTTPS URL in the secrets file (see docs/dev/database-provisioning.md).
      ADMINER_URL: ${ADMINER_URL:-}
      PROJECTS_DIR: ${VEXLYX_HOME:-/opt/vexlyx}/apps/api/workspaces/projects
      SSH_KEYS_DIR: ${VEXLYX_HOME:-/opt/vexlyx}/apps/api/workspaces/keys
    depends_on:
      - postgres
      - redis
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.vexlyx-api.rule=Host(`api.${VEXLYX_DOMAIN}`)"
      - "traefik.http.routers.vexlyx-api.entrypoints=websecure"
      - "traefik.http.routers.vexlyx-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.vexlyx-api.loadbalancer.server.port=5000"
