# Traefik v3 — Static Configuration
# Dynamic routing configs go in ./dynamic/

api:
  dashboard: true
  insecure: true

ping: {}

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        idleTimeout: 180s

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@vexlyx.com"
      storage: "/etc/traefik/acme.json"
      httpChallenge:
        entryPoint: "web"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: "/etc/traefik/dynamic"
    watch: true
