services:
  postgres:
    image: postgres:16-alpine
    container_name: vexlyx-postgres
    restart: unless-stopped
    ports:
      # Loopback only: these dev databases use well-known credentials, so they
      # must not be reachable from the LAN (#56). Production clears the list.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: vexlyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vexlyx_dev}
      POSTGRES_DB: vexlyx_dev
    volumes:
      - vexlyx_postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexlyx -d vexlyx_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: vexlyx-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vexlyx_mysql_root}
      MYSQL_DATABASE: vexlyx_dev
      MYSQL_USER: vexlyx
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vexlyx_dev}
    volumes:
      - vexlyx_mysql_data:/var/lib/mysql
    networks:
      - default
      - traefik-net
    healthcheck:
      # MYSQL_PWD (read from the container's own env) keeps the root password
      # out of the process argument list, which any local user can see via ps.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: vexlyx-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - vexlyx_redis_data:/data
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  adminer:
    image: adminer:4
    container_name: vexlyx-adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: vexlyx-postgres
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.vexlyx.localhost`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  traefik:
    # v3.6.1+ required: Docker 29 raised its minimum accepted API version,
    # and Traefik <=3.5's docker provider hardcodes API 1.24 (ignoring
    # DOCKER_API_VERSION entirely), which the daemon then rejects outright —
    # v3.6.1 added Docker API auto-negotiation to fix this.
    image: traefik:v3.6
    container_name: vexlyx-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
      - ./docker/traefik/acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - traefik-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  coredns:
    image: coredns/coredns:1.11.3
    container_name: vexlyx-coredns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"
    volumes:
      - ./docker/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./docker/coredns/zones:/etc/coredns/zones:ro
    networks:
      - default
      - traefik-net

  mail-state-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    environment:
      VEXLYX_MAIL_UID: ${VEXLYX_MAIL_UID:-}
      VEXLYX_MAIL_GID: ${VEXLYX_MAIL_GID:-}
    volumes:
      - ${VEXLYX_MAIL_STATE_DIR:-./docker/mail-data/state}:/state
      - .:/source:ro
    entrypoint: ["/bin/sh", "-ec", "sed 's/\\r$$//' /source/docker/mail-state-init.sh > /tmp/mail-state-init.sh; exec sh /tmp/mail-state-init.sh"]

  postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    image: vexlyx-postfix:latest
    container_name: vexlyx-postfix
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSION_PORT:-587}:587"
    volumes:
      - ${VEXLYX_MAIL_STATE_DIR:-./docker/mail-data/state}/postfix:/var/lib/vexlyx-mail/postfix
      - ${VEXLYX_MAIL_STATE_DIR:-./docker/mail-data/state}/opendkim:/etc/opendkim
      - ./docker/postfix/opendkim/opendkim.conf:/etc/opendkim/opendkim.conf:ro
      # Shared Maildir storage with Dovecot (F4.2) — a host bind mount rather
      # than a named volume, since named volumes reset ownership to root on
      # Windows/WSL2 mounts (see the /var/spool/postfix note below).
      - ./docker/mail-data/vhosts:/var/mail/vhosts
      # Delivery/bounce log (F4.8) — same host-bind-mount convention as
      # vhosts above (named volumes reset ownership to root on Windows).
      - ./docker/mail-data/logs:/var/log/postfix
      # NOTE: /var/spool/postfix is intentionally NOT a named volume.
      # Docker named volumes on Windows (WSL2) reset directory ownership to root
      # on mount, which causes Postfix's cleanup daemon to fail with:
      #   451 4.3.0 Error: queue file write error
      # The spool is ephemeral for dev — production uses the host filesystem.
    networks:
      - default
      - traefik-net
    depends_on:
      mail-state-init:
        condition: service_completed_successfully
      dovecot:
        condition: service_healthy

  dovecot:
    build:
      context: ./docker/dovecot
      dockerfile: Dockerfile
    image: vexlyx-dovecot:latest
    container_name: vexlyx-dovecot
    restart: unless-stopped
    environment:
      VEXLYX_SEED_DEV_FIXTURES: "true"
    depends_on:
      mail-state-init:
        condition: service_completed_successfully
    ports:
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
    volumes:
      - ./docker/mail-data/vhosts:/var/mail/vhosts
      - ${VEXLYX_MAIL_STATE_DIR:-./docker/mail-data/state}/dovecot:/var/lib/vexlyx-mail/dovecot
    networks:
      - default
      - traefik-net

  roundcube:
    image: roundcube/roundcubemail:1.6.18-apache
    container_name: vexlyx-roundcube
    restart: unless-stopped
    ports:
      - "${WEBMAIL_PORT:-8089}:80"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      # tls:// forces STARTTLS — Dovecot's `ssl = required` (docker/dovecot/dovecot.conf)
      # rejects auth on a plaintext connection, so a bare "dovecot"/"postfix"
      # host (no scheme) silently fails every login. See docker/roundcube/config/local.inc.php
      # for how the self-signed-cert trust override this requires is gated.
      # Development ONLY: docker-compose.prod.yml sets this back to "true".
      ROUNDCUBE_MAIL_TLS_VERIFY: "false"
      ROUNDCUBEMAIL_DEFAULT_HOST: tls://dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: tls://postfix
      ROUNDCUBEMAIL_SMTP_PORT: 587
    volumes:
      - vexlyx_roundcube_data:/var/roundcube/db
      - ./docker/roundcube/config:/var/roundcube/config:ro
    networks:
      - default
      - traefik-net
    depends_on:
      - dovecot
      - postfix
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`webmail.vexlyx.localhost`)"
      - "traefik.http.routers.webmail.entrypoints=web"
      - "traefik.http.services.webmail.loadbalancer.server.port=80"

volumes:
  vexlyx_postgres_data:
  vexlyx_mysql_data:
  vexlyx_redis_data:
  vexlyx_roundcube_data:

networks:
  default:
  traefik-net:
    external: true
