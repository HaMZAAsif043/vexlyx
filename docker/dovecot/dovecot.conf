# Vexlyx Dovecot IMAP & LMTP Server main.conf (F4.2, F4.7)
# Incoming mail access for virtual mailboxes delivered by Postfix.
# Virtual users live in a persistent generation's passwd-file that acts
# as BOTH passdb and userdb, kept in sync from Postgres by dovecot_manager.py.

protocols = imap lmtp

listen = *
base_dir = /var/run/dovecot

# Virtual mailbox storage — must match Postfix's virtual_mailbox_base so both
# containers read/write the same Maildir tree (shared bind mount in
# docker-compose.yml at ./docker/mail-data/vhosts).
#
# Indexes and control files (dovecot.index*, dovecot-uidlist,
# dovecot-uidvalidity) are kept on a container-local path instead of the
# shared bind mount: their open+fstat+rename-temp-file update pattern
# reliably fails with ENOENT on Docker Desktop's Windows bind-mount
# filesystem (virtiofs/gRPC-FUSE). Both are Dovecot's private, disposable
# cache/metadata — safe to keep off the shared volume; only the actual
# Maildir message files need to be shared with Postfix.
mail_location = maildir:/var/mail/vhosts/%d/%n/Maildir:INDEX=/var/indexes/%d/%n:CONTROL=/var/indexes/%d/%n
mail_home = /var/mail/vhosts/%d/%n

# Fixed numeric uid/gid used for all virtual mail delivery/access.
# Must match Postfix's virtual_uid_maps / virtual_gid_maps (main.cf) exactly,
# since both containers write to the same Maildir files.
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
first_valid_gid = 5000

namespace inbox {
  inbox = yes
}

!include /var/lib/vexlyx-mail/dovecot/active.conf
auth_cache_size = 0

disable_plaintext_auth = yes
auth_mechanisms = plain login

ssl = required
ssl_cert = </etc/dovecot/certs/cert.pem
ssl_key = </etc/dovecot/certs/key.pem
ssl_min_protocol = TLSv1.2

# Maildir++ quota, enforced per-mailbox via the userdb_quota_rule extra field
# written into the active passwd-file by mail_state.py (kept in sync with
# the Mailbox.quota column, interpreted in megabytes).
mail_plugins = $mail_plugins quota

# Outgoing SMTP relay for Pigeonhole Sieve vacation auto-replies (F4.7)
submission_host = postfix:25

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  quota = maildir:User quota
  sieve = /var/mail/vhosts/%d/%n/.dovecot.sieve
  sieve_default = /var/mail/vhosts/%d/%n/.dovecot.sieve
  sieve_vacation_send_from_recipient = yes
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# LMTP service listener for local delivery from Postfix with Sieve processing (F4.7)
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# SASL auth exposed over TCP so Postfix — a separate container — can
# authenticate SMTP submission (port 587) against these same virtual users.
# Postfix main.cf: smtpd_sasl_type = dovecot, smtpd_sasl_path = inet:dovecot:12345
service auth {
  inet_listener {
    port = 12345
  }
}

log_path = /dev/stderr
info_log_path = /dev/stdout
